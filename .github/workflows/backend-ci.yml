name: Backend CI Pipeline

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-python-ai-engine:
    name: AI Engine AST Analyzer (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tree-sitter tree-sitter-java tree-sitter-python pytest

      - name: Run AST Analyzer Pytest Suite
        run: |
          python -m pytest backend/ai-engine/tests/test_ast_analyzer.py -v

  test-java-services:
    name: Java Services CI (Java 21 LTS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Build & Unit Tests
        run: |
          cd backend/services/integration-service
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw test -B
          else
            mvn test -B
          fi
