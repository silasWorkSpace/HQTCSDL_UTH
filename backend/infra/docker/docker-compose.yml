name: livingdocs

# Mac dinh (khong profile): ha tang gom SQL Server, Redis, Kafka.
#   docker compose -f backend/infra/docker/docker-compose.yml up -d
# Profile "full": them cac service cua ung dung.
#   docker compose -f backend/infra/docker/docker-compose.yml --profile full up -d --build

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: livingdocs-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Chua co MSSQL_SA_PASSWORD trong file .env}
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ../mssql:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: livingdocs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Kafka mot node (KRaft, khong can Zookeeper).
  # Tu may host ket noi: localhost:9092. Tu container khac trong compose: kafka:19092.
  kafka:
    image: apache/kafka:4.0.0
    container_name: livingdocs-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  identity-service:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: services/identity-service/Dockerfile
    container_name: livingdocs-identity
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mssql
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
    ports:
      - "8081:8081"
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mssql_data:
  kafka_data:
