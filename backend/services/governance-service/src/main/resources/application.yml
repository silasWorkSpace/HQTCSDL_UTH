    name: governance-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=livingdocs;trustServerCertificate=true;encrypt=false}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:LivingDocsPassw0rd!}
