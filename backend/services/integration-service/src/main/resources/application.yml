server:
  port: 8082

spring:
  application:
    name: integration-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=livingdocs;trustServerCertificate=true;encrypt=false}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false

# Management & Health Check (NFR-MAIN-06)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

# OpenAPI Swagger Configuration (NFR-MAIN-03)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# GitHub & Security Configuration
livingdocs:
  security:
    jwt-secret: ${JWT_SECRET}
    issuer: livingdocs
    public-paths:
      - /api/v1/webhooks/github/**
      - /internal/v1/**
    # 256-bit AES key in Base64 (32 bytes)
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET}
  github:
    app-id: ${GITHUB_APP_ID:}
    private-key-pem: ${GITHUB_APP_PRIVATE_KEY_PEM:}
    api-url: ${GITHUB_API_URL:https://api.github.com}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:}
  kafka:
    topics:
      source-events: ld.source-events
