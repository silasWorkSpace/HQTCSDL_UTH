server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:livingdocs};encrypt=true;trustServerCertificate=true
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:Living_Docs_2026!}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

livingdocs:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    issuer: livingdocs
    access-token-ttl: 15m
    public-paths:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/dev-token
  identity:
    refresh-token-ttl: 7d
    default-role: Developer
