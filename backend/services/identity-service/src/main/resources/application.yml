server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:livingdocs};encrypt=true;trustServerCertificate=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

livingdocs:
  security:
    jwt-secret: ${JWT_SECRET}
    issuer: livingdocs
    access-token-ttl: 15m
    public-paths:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/csrf
      - /api/v1/auth/github/url
      - /api/v1/auth/github/callback
  identity:
    refresh-token-ttl: 7d
    default-role: Developer
  integration:
    base-url: ${INTEGRATION_SERVICE_URL:http://localhost:8082}

# GitHub OAuth Login (FR-AUTH-02)
github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI}
  scope: ${GITHUB_SCOPE:read:user,user:email,repo}

