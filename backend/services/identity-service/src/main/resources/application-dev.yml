# Chi dung khi chay may dev (profile dev). KHONG dung cac gia tri mac dinh nay o moi truong that.
spring:
  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}

livingdocs:
  security:
    jwt-secret: ${JWT_SECRET}

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI}
  scope: ${GITHUB_SCOPE:read:user,user:email,repo}
